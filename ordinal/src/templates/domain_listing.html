<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Domain entries">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="../styles/main.css">
    <script src="../main.js" defer></script>
</head>
<body class="theme-aleph">
    <header class="masthead">
        <div class="brand">
            <div class="brand-mark">
                <img src="../images/aleph-no-background-web256x256.png" alt="Aleph symbol">
            </div>
            <div class="brand-text">
                <h1>THE INFINITE ARCHIVE</h1>
                <p class="tagline">formless and empty</p>
            </div>
        </div>
        <nav class="primary-nav">
            <a href="/index.html">Home</a>
            <a href="/articles/articles.html">Entries</a>
        </nav>
    </header>

    <main class="layout-shell section-layout">
        <section class="panel">
            <div class="panel-head">
                <h3>{{ articles|length }} entries</h3>
            </div>
            <div class="section-table">
                <div class="table-head grid">
                    <span>Title</span>
                    <span>Division</span>
                    <span>Slug</span>
                    <span>Link</span>
                </div>
                <div class="table-body">
                    {% for article in articles %}
                    <div class="table-row grid">
                        <span class="cell title">{{ article.title }}</span>
                        <span class="cell division">{{ article.division | join(', ') }}</span>
                        <span class="cell modified">{{ article.slug }}</span>
                        <span class="cell link"><a href="{{ article.url }}">Open</a></span>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2025 Aleph. Ordinal</p>
    </footer>
</body>
</html>
